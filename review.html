<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Review - FinFlow AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #0f172a;
    color: white;
    min-height: 100vh;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 230px;
    height: 100vh;
    background: #111827;
    padding: 25px 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 35px;
    padding-left: 10px;
}

.nav a {
    display: block;
    color: #cbd5e1;
    text-decoration: none;
    padding: 13px 15px;
    margin: 6px 0;
    border-radius: 8px;
}

.nav a:hover,
.nav a.active {
    background: #1e293b;
    color: white;
}

.main {
    margin-left: 230px;
    padding: 35px;
    max-width: 1200px;
}

h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
}

.card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
}

.card h2 {
    margin-bottom: 20px;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.info {
    background: #172033;
    padding: 16px;
    border-radius: 10px;
}

.label {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 7px;
}

.value {
    font-size: 16px;
    font-weight: bold;
}

.status {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
}

.verified {
    background: #064e3b;
    color: #6ee7b7;
}

.review {
    background: #78350f;
    color: #fcd34d;
}

.pending {
    background: #1e3a8a;
    color: #93c5fd;
}

.approved-status {
    background: #064e3b;
    color: #6ee7b7;
}

.rejected-status {
    background: #7f1d1d;
    color: #fecaca;
}

/* GENAI */

.ai-box {
    background: linear-gradient(
        135deg,
        #172554,
        #1e1b4b
    );

    border: 1px solid #3730a3;
    border-radius: 14px;
    padding: 22px;
    margin-top: 20px;
}

.ai-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 8px;
}

.ai-subtitle {
    color: #a5b4fc;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 15px;
}

.ai-reasoning {
    background: #0f172a;
    border-radius: 10px;
    padding: 18px;
    color: #e2e8f0;
    line-height: 1.7;
    font-size: 14px;
    white-space: pre-wrap;
    border-left: 4px solid #6366f1;
}

/* APPROVAL */

.approval-box {
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    background: #172033;
    border: 1px solid #334155;
}

.approval-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.approval-text {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.6;
}

.buttons {
    display: flex;
    gap: 15px;
    margin-top: 20px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 13px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.approve {
    background: #059669;
    color: white;
}

.approve:hover {
    background: #047857;
}

.reject {
    background: #dc2626;
    color: white;
}

.reject:hover {
    background: #b91c1c;
}

.review-btn {
    background: #d97706;
    color: white;
}

.review-btn:hover {
    background: #b45309;
}

.message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    display: none;
}

.success {
    background: #064e3b;
    color: #a7f3d0;
}

.warning {
    background: #78350f;
    color: #fde68a;
}

.error {
    background: #7f1d1d;
    color: #fecaca;
}

.empty {
    text-align: center;
    padding: 50px;
    color: #94a3b8;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #93c5fd;
}

@media (max-width: 700px) {

    .sidebar {
        width: 180px;
    }

    .main {
        margin-left: 180px;
        padding: 20px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        💰 FinFlow AI
    </div>

    <div class="nav">

        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="document.html">
            📄 Documents
        </a>

        <a href="upload.html">
            ⬆ Upload
        </a>

        <a href="processing.html">
            ⚙ Processing
        </a>

        <a href="review.html" class="active">
            ✅ Review
        </a>

        <a href="reports.html">
            📊 Reports
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="main">

    <h1>
        Human Review
    </h1>

    <p class="subtitle">
        Review AI-processed accounting documents before final approval
    </p>


    <div id="reviewArea">

        <div class="loading">
            Loading document...
        </div>

    </div>

</div>


<script>


/* ==========================================
   API
========================================== */

const API_URL =
    "https://chili-latch-cardinal.ngrok-free.dev";


/* ==========================================
   LOGIN CHECK
========================================== */

const loggedIn =
    localStorage.getItem("loggedIn");

const userEmail =
    localStorage.getItem("userEmail");


if (
    loggedIn !== "true" ||
    !userEmail
) {

    window.location.href =
        "index.html";

}


/* ==========================================
   GLOBAL DOCUMENT
========================================== */

let currentDocument = null;


/* ==========================================
   HTML SAFE TEXT
========================================== */

function escapeHtml(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   LOAD DOCUMENT
========================================== */

async function loadDocument() {

    const area =
        document.getElementById(
            "reviewArea"
        );


    try {

        /* ==================================
           GET DOCUMENTS
        ================================== */

        const response =
            await fetch(
                `${API_URL}/documents/`,
                {

                    method: "GET",

                    headers: {

                        "ngrok-skip-browser-warning":
                            "true"

                    }

                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load documents."
            );

        }


        const data =
            await response.json();


        console.log(
            "Documents response:",
            data
        );


        const documents =
            data.documents || [];


        /* ==================================
           NO DOCUMENT
        ================================== */

        if (
            documents.length === 0
        ) {

            area.innerHTML = `

                <div class="card">

                    <div class="empty">

                        No documents available for review.

                        <br><br>

                        <a
                            href="upload.html"
                            style="
                                color:#60a5fa;
                                text-decoration:none;
                                font-weight:bold;
                            "
                        >
                            Upload a document
                        </a>

                    </div>

                </div>

            `;

            return;

        }


        /* ==================================
           GET LATEST / CURRENT DOCUMENT
        ================================== */

        const savedDocumentId =
            localStorage.getItem(
                "documentId"
            );


        if (savedDocumentId) {

            currentDocument =
                documents.find(
                    function(doc) {

                        return String(doc.id) ===
                            String(savedDocumentId);

                    }
                );

        }


        /* If saved document was not found,
           use latest document */

        if (!currentDocument) {

            currentDocument =
                documents[0];

        }


        const doc =
            currentDocument;


        /* ==================================
           VERIFICATION
        ================================== */

        let verificationClass =
            "review";


        if (
            doc.verification_status ===
            "verified"
        ) {

            verificationClass =
                "verified";

        }


        /* ==================================
           WORKFLOW
        ================================== */

        let workflowStatus =
            doc.workflow_status ||
            "Pending";


        let workflowClass =
            "pending";


        if (
            workflowStatus ===
            "approved"
        ) {

            workflowClass =
                "approved-status";

        }

        else if (
            workflowStatus ===
            "rejected"
        ) {

            workflowClass =
                "rejected-status";

        }

        else if (
            workflowStatus ===
            "needs_review"
        ) {

            workflowClass =
                "review";

        }


        /* ==================================
           GET GENAI RESULT
        ================================== */

        let managerAgent = null;


        try {

            const savedManagerAgent =
                localStorage.getItem(
                    "managerAgent"
                );


            if (
                savedManagerAgent
            ) {

                managerAgent =
                    JSON.parse(
                        savedManagerAgent
                    );

            }

        }

        catch (error) {

            console.log(
                "Unable to read Manager Agent data."
            );

        }


        let aiReasoning =
            managerAgent &&
            managerAgent.ai_reasoning
                ? managerAgent.ai_reasoning
                : "GenAI reasoning is not available for this document.";


        /* ==================================
           DISPLAY
        ================================== */

        area.innerHTML = `

            <div class="card">

                <h2>
                    📄 Document Information
                </h2>


                <div class="info-grid">


                    <div class="info">

                        <div class="label">
                            Document ID
                        </div>

                        <div class="value">
                            #${escapeHtml(doc.id)}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            File Name
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                doc.file_name || "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Invoice Number
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                doc.invoice_number || "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Vendor
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                doc.vendor || "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Total Amount
                        </div>

                        <div class="value">
                            ₹${escapeHtml(
                                doc.total_amount || "0"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Category
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                doc.category || "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            AI Verification
                        </div>

                        <div class="value">

                            <span
                                class="status ${verificationClass}"
                            >

                                ${escapeHtml(
                                    doc.verification_status ||
                                    "Pending"
                                )}

                            </span>

                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Workflow Status
                        </div>

                        <div class="value">

                            <span
                                class="status ${workflowClass}"
                            >

                                ${escapeHtml(
                                    workflowStatus
                                )}

                            </span>

                        </div>

                    </div>


                </div>


                <!-- GENAI -->

                <div class="ai-box">

                    <div class="ai-title">
                        🧠 GenAI Manager Reasoning
                    </div>

                    <div class="ai-subtitle">

                        Llama 3.2 analyzed the outputs
                        from the accounting agents and
                        recommended the next workflow action.

                    </div>

                    <div class="ai-reasoning">

                        ${escapeHtml(
                            aiReasoning
                        )}

                    </div>

                </div>


                <!-- HUMAN APPROVAL -->

                <div class="approval-box">

                    <div class="approval-title">
                        👤 Human Decision Required
                    </div>

                    <div class="approval-text">

                        AI provides a recommendation,
                        but the final accounting decision
                        must always be made by a human reviewer.

                    </div>


                    <div class="buttons">


                        <button
                            id="approveBtn"
                            class="approve"
                            onclick="approveDocument()"
                        >

                            ✓ Approve Document

                        </button>


                        <button
                            id="rejectBtn"
                            class="reject"
                            onclick="rejectDocument()"
                        >

                            ✕ Reject Document

                        </button>


                        <button
                            id="reviewBtn"
                            class="review-btn"
                            onclick="sendForReview()"
                        >

                            ↻ Send for Further Review

                        </button>


                    </div>

                </div>


                <div
                    id="message"
                    class="message">
                </div>


            </div>

        `;

    }


    catch (error) {

        console.error(
            "Review loading error:",
            error
        );


        area.innerHTML = `

            <div class="card">

                <div
                    class="message error"
                    style="display:block"
                >

                    ❌ ${escapeHtml(
                        error.message
                    )}

                    <br><br>

                    Make sure FastAPI backend is running.

                </div>

            </div>

        `;

    }

}


/* ==========================================
   APPROVAL UPDATE
========================================== */

async function updateApproval(
    decision
) {

    if (!currentDocument) {

        return;

    }


    const message =
        document.getElementById(
            "message"
        );


    const approveBtn =
        document.getElementById(
            "approveBtn"
        );


    const rejectBtn =
        document.getElementById(
            "rejectBtn"
        );


    const reviewBtn =
        document.getElementById(
            "reviewBtn"
        );


    try {

        /* Disable buttons */

        approveBtn.disabled =
            true;

        rejectBtn.disabled =
            true;

        reviewBtn.disabled =
            true;


        /* ==================================
           SEND APPROVAL
        ================================== */

        const response =
            await fetch(
                `${API_URL}/approval/`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "ngrok-skip-browser-warning":
                            "true"

                    },

                    body: JSON.stringify({

                        document_name:
                            currentDocument.file_name,

                        decision:
                            decision

                    })

                }
            );


        const data =
            await response.json();


        console.log(
            "Approval response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.message ||
                data.detail ||
                "Approval request failed."
            );

        }


        /* ==================================
           SAVE RESPONSE
        ================================== */

        localStorage.setItem(
            "approvalResponse",
            JSON.stringify(data)
        );


        /* ==================================
           SHOW RESULT
        ================================== */

        if (
            decision ===
            "approve"
        ) {

            message.className =
                "message success";

            message.textContent =
                "✅ Document approved successfully!";

        }

        else if (
            decision ===
            "reject"
        ) {

            message.className =
                "message error";

            message.textContent =
                "❌ Document rejected successfully!";

        }

        else {

            message.className =
                "message warning";

            message.textContent =
                "⚠ Document sent for further review!";

        }


        message.style.display =
            "block";


        /* ==================================
           REDIRECT
        ================================== */

        setTimeout(
            function() {

                window.location.href =
                    "document.html";

            },
            2000
        );

    }


    catch (error) {

        console.error(
            "Approval error:",
            error
        );


        message.className =
            "message error";


        message.textContent =
            "❌ " +
            error.message;


        message.style.display =
            "block";


        /* Enable buttons */

        approveBtn.disabled =
            false;

        rejectBtn.disabled =
            false;

        reviewBtn.disabled =
            false;

    }

}


/* ==========================================
   APPROVE
========================================== */

function approveDocument() {

    updateApproval(
        "approve"
    );

}


/* ==========================================
   REJECT
========================================== */

function rejectDocument() {

    updateApproval(
        "reject"
    );

}


/* ==========================================
   FURTHER REVIEW
========================================== */

function sendForReview() {

    updateApproval(
        "review"
    );

}


/* ==========================================
   START
========================================== */

loadDocument();


</script>

</body>

</html>
