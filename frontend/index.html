<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>FinFlow AI - Login</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #eef4ff, #f8fbff);
}

.login-container {
    width: 100%;
    max-width: 430px;
    padding: 20px;
}

.login-card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
}

.logo {
    width: 70px;
    height: 70px;
    margin: 0 auto 20px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2563eb;
    color: white;
    font-size: 30px;
    font-weight: bold;
}

h1 {
    text-align: center;
    color: #172033;
    margin-bottom: 8px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 30px;
    font-size: 14px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
}

input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
}

.remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 5px 0 20px;
    color: #6b7280;
    font-size: 14px;
}

.remember-row input {
    width: 16px;
    height: 16px;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:hover {
    background: #1d4ed8;
}

.login-btn:disabled {
    background: #93c5fd;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 14px;
}

#error {
    background: #fee2e2;
    color: #b91c1c;
}

#success {
    background: #dcfce7;
    color: #15803d;
}

.signup-text {
    text-align: center;
    margin-top: 22px;
    color: #6b7280;
    font-size: 14px;
}

.signup-text a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.signup-text a:hover {
    text-decoration: underline;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #9ca3af;
    font-size: 12px;
}

</style>

</head>


<body>


<div class="login-container">


<div class="login-card">


<div class="logo">
    F
</div>


<h1>
    FinFlow AI
</h1>


<p class="subtitle">
    Intelligent Accounting Operations Automation
</p>



<div
    id="error"
    class="message">
</div>


<div
    id="success"
    class="message">
</div>



<form id="loginForm">


<div class="form-group">

<label for="email">
    Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

</div>



<div class="form-group">

<label for="password">
    Password
</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

</div>



<div class="remember-row">

<input
    type="checkbox"
    id="rememberMe"
>

<label
    for="rememberMe"
    style="margin:0;font-weight:normal;"
>
    Remember me
</label>

</div>



<button
    type="submit"
    id="loginBtn"
    class="login-btn"
>
    Sign In →
</button>


</form>



<div class="signup-text">

    Don't have an account?

    <a href="signup.html">
        Create Account
    </a>

</div>



<div class="footer">
    © 2026 FinFlow AI
</div>


</div>

</div>



<script>


/* =========================================
   API
========================================= */

const API_URL =
    "https://finflow-ai-rszo.onrender.com";



/* =========================================
   FORM
========================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const error =
    document.getElementById(
        "error"
    );


const success =
    document.getElementById(
        "success"
    );



/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        error.style.display =
            "none";

        success.style.display =
            "none";



        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        const rememberMe =
            document
                .getElementById("rememberMe")
                .checked;



        if (
            !email ||
            !password
        ) {

            error.textContent =
                "Please enter email and password.";

            error.style.display =
                "block";

            return;

        }



        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Signing in...";



        try {


            /* =================================
               FORM DATA
            ================================= */

            const formData =
                new FormData();


            formData.append(
                "email",
                email
            );


            formData.append(
                "password",
                password
            );



            /* =================================
               BACKEND LOGIN
            ================================= */

            const response =
                await fetch(
                    `${API_URL}/auth/login`,
                    {

                        method: "POST",

                        headers: {

                            "ngrok-skip-browser-warning":
                                "true"

                        },

                        body: formData

                    }
                );



            let data = {};


            try {

                data =
                    await response.json();

            }

            catch {

                data = {};

            }



            console.log(
                "Login status:",
                response.status
            );


            console.log(
                "Login response:",
                data
            );



            /* =================================
               LOGIN ERROR
            ================================= */

            if (
                !response.ok
            ) {


                if (
                    response.status === 401
                ) {

                    error.textContent =
                        data.detail ||
                        "Invalid email or password.";

                }

                else if (
                    response.status === 422
                ) {

                    error.textContent =
                        "Please enter valid email and password.";

                }

                else if (
                    response.status >= 500
                ) {

                    error.textContent =
                        "FinFlow AI server error. Please try again.";

                }

                else {

                    error.textContent =
                        data.detail ||
                        data.message ||
                        "Login failed.";

                }


                error.style.display =
                    "block";


                return;

            }



            /* =================================
               SUCCESS
            ================================= */

            if (
                data.message ===
                "Login successful"
            ) {


                /*
                   IMPORTANT:
                   Save actual database user
                   name and email.
                */

                localStorage.setItem(
                    "userName",
                    data.name ||
                    ""
                );


                localStorage.setItem(
                    "userEmail",
                    data.email ||
                    email
                );


                localStorage.setItem(
                    "loggedIn",
                    "true"
                );



                /* =================================
                   REMEMBER ME
                ================================= */

                if (
                    rememberMe
                ) {

                    localStorage.setItem(
                        "rememberMe",
                        "true"
                    );

                }

                else {

                    localStorage.removeItem(
                        "rememberMe"
                    );

                }



                /* =================================
                   SUCCESS MESSAGE
                ================================= */

                success.textContent =
                    `Welcome ${data.name || "User"}! Login successful.`;

                success.style.display =
                    "block";



                /* =================================
                   REDIRECT
                ================================= */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    700
                );


                return;

            }



            /* =================================
               UNKNOWN RESPONSE
            ================================= */

            error.textContent =
                data.detail ||
                data.message ||
                "Login failed. Please try again.";

            error.style.display =
                "block";


        }


        catch (err) {


            console.error(
                "Login Error:",
                err
            );


            error.textContent =
                "Cannot connect to FinFlow AI backend. Please make sure FastAPI and ngrok are running.";

            error.style.display =
                "block";

        }


        finally {


            loginBtn.disabled =
                false;


            loginBtn.textContent =
                "Sign In →";

        }

    }
);



/* =========================================
   LOAD SAVED EMAIL
========================================= */

window.addEventListener(
    "load",
    function() {


        const savedEmail =
            localStorage.getItem(
                "userEmail"
            );


        const rememberMe =
            localStorage.getItem(
                "rememberMe"
            );


        if (
            savedEmail &&
            rememberMe === "true"
        ) {

            document.getElementById(
                "email"
            ).value =
                savedEmail;


            document.getElementById(
                "rememberMe"
            ).checked =
                true;

        }

    }
);


</script>


</body>

</html>
