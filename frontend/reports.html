```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Reports - FinFlow AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #0f172a;
    color: white;
    min-height: 100vh;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 230px;
    height: 100vh;
    background: #111827;
    padding: 25px 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 35px;
    padding-left: 10px;
}

.nav a {
    display: block;
    color: #cbd5e1;
    text-decoration: none;
    padding: 13px 15px;
    margin: 6px 0;
    border-radius: 8px;
}

.nav a:hover,
.nav a.active {
    background: #1e293b;
    color: white;
}

.main {
    margin-left: 230px;
    padding: 35px;
    max-width: 1250px;
}

h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
}

.card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
}

.card h2 {
    margin-bottom: 20px;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.info {
    background: #172033;
    padding: 16px;
    border-radius: 10px;
}

.label {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 8px;
}

.value {
    font-size: 16px;
    font-weight: bold;
}

.status {
    display: inline-block;
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
}

.verified {
    background: #064e3b;
    color: #6ee7b7;
}

.approved {
    background: #064e3b;
    color: #6ee7b7;
}

.review {
    background: #78350f;
    color: #fcd34d;
}

.rejected {
    background: #7f1d1d;
    color: #fca5a5;
}

.pending {
    background: #1e3a8a;
    color: #93c5fd;
}

.summary {
    line-height: 1.7;
    color: #cbd5e1;
}

.decision-box {
    background: #172033;
    border-left: 4px solid #64748b;
    padding: 18px;
    border-radius: 8px;
    line-height: 1.7;
}

.log {
    margin-top: 10px;
}

.log-item {
    padding: 10px 0;
    border-bottom: 1px solid #263244;
    color: #cbd5e1;
}

/* ==============================
   GENAI REASONING
============================== */

.ai-box {
    background: linear-gradient(
        135deg,
        #172554,
        #1e1b4b
    );

    border: 1px solid #3730a3;
    border-radius: 14px;
    padding: 22px;
}

.ai-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.ai-subtitle {
    color: #a5b4fc;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 15px;
}

.ai-reasoning {
    background: #0f172a;
    border-radius: 10px;
    padding: 18px;
    color: #e2e8f0;
    line-height: 1.7;
    font-size: 14px;
    white-space: pre-wrap;
    border-left: 4px solid #6366f1;
}

.empty {
    text-align: center;
    padding: 50px;
    color: #94a3b8;
}

.error {
    color: #fca5a5;
    padding: 20px;
}

@media (max-width: 900px) {

    .info-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 650px) {

    .sidebar {
        width: 180px;
    }

    .main {
        margin-left: 180px;
        padding: 20px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        💰 FinFlow AI
    </div>

    <div class="nav">

        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="document.html">
            📄 Documents
        </a>

        <a href="upload.html">
            ⬆ Upload
        </a>

        <a href="processing.html">
            ⚙ Processing
        </a>

        <a href="review.html">
            ✅ Review
        </a>

        <a href="reports.html" class="active">
            📊 Reports
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="main">

    <h1>
        Reports
    </h1>

    <p class="subtitle">
        AI processing and accounting workflow report
    </p>


    <div id="reportArea">

        <div class="empty">
            Loading report...
        </div>

    </div>

</div>


<script>


const response =
    await fetch(
        "https://chili-latch-cardinal.ngrok-free.dev/auth/login",
        {
            method: "POST",

            headers: {
                "ngrok-skip-browser-warning": "true"
            },

            body: formData
        }
    );

/* ==========================================
   HTML SAFE TEXT
========================================== */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   LOAD REPORT
========================================== */

async function loadReport() {

    const area =
        document.getElementById(
            "reportArea"
        );


    try {

        const response =
            await fetch(
                `${API_URL}/documents/`
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load report"
            );

        }


        const data =
            await response.json();


        const documents =
            data.documents || [];


        if (documents.length === 0) {

            area.innerHTML = `

                <div class="card">

                    <div class="empty">

                        No processed documents available.

                    </div>

                </div>

            `;

            return;

        }


        /* ==================================
           LATEST DOCUMENT
        ================================== */

        const doc =
            documents[0];


        /* ==================================
           VERIFICATION
        ================================== */

        let verificationClass =
            doc.verification_status === "verified"
                ? "verified"
                : "review";


        /* ==================================
           WORKFLOW
        ================================== */

        let workflowClass =
            "pending";


        if (
            doc.workflow_status === "approved"
        ) {

            workflowClass =
                "approved";

        }

        else if (
            doc.workflow_status === "rejected"
        ) {

            workflowClass =
                "rejected";

        }

        else if (
            doc.workflow_status === "needs_review"
        ) {

            workflowClass =
                "review";

        }


        /* ==================================
           GENAI DATA
        ================================== */

        let managerAgent = null;


        try {

            const savedManagerAgent =
                localStorage.getItem(
                    "managerAgent"
                );


            if (savedManagerAgent) {

                managerAgent =
                    JSON.parse(
                        savedManagerAgent
                    );

            }

        }

        catch (error) {

            console.log(
                "Manager Agent data unavailable"
            );

        }


        let aiReasoning =
            managerAgent &&
            managerAgent.ai_reasoning
                ? managerAgent.ai_reasoning
                : "GenAI reasoning is not available for this document.";


        /* ==================================
           HUMAN DECISION
        ================================== */

        let humanDecision =
            "Waiting for human approval.";


        if (
            doc.workflow_status === "approved"
        ) {

            humanDecision =
                "Document approved by human reviewer.";

        }

        else if (
            doc.workflow_status === "rejected"
        ) {

            humanDecision =
                "Document rejected by human reviewer.";

        }

        else if (
            doc.workflow_status === "needs_review"
        ) {

            humanDecision =
                "Document requires further review.";

        }


        /* ==================================
           DISPLAY REPORT
        ================================== */

        area.innerHTML = `


            <!-- DOCUMENT REPORT -->

            <div class="card">

                <h2>
                    📄 Document Report
                </h2>


                <div class="info-grid">


                    <div class="info">

                        <div class="label">
                            Document ID
                        </div>

                        <div class="value">
                            #${doc.id}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            File Name
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                doc.file_name || "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Invoice Number
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                doc.invoice_number || "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Vendor
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                doc.vendor || "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Total Amount
                        </div>

                        <div class="value">
                            ₹${escapeHtml(
                                doc.total_amount || "0"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Expense Category
                        </div>

                        <div class="value">
                            ${escapeHtml(
                                doc.category || "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            AI Verification
                        </div>

                        <div class="value">

                            <span
                                class="status ${verificationClass}">

                                ${escapeHtml(
                                    doc.verification_status ||
                                    "Pending"
                                )}

                            </span>

                        </div>

                    </div>


                    <div class="info">

                        <div class="label">
                            Human Workflow Status
                        </div>

                        <div class="value">

                            <span
                                class="status ${workflowClass}">

                                ${escapeHtml(
                                    doc.workflow_status ||
                                    "Pending"
                                )}

                            </span>

                        </div>

                    </div>


                </div>

            </div>


            <!-- AI SUMMARY -->

            <div class="card">

                <h2>
                    🤖 AI Processing Summary
                </h2>

                <p class="summary">

                    FinFlow AI received the accounting
                    document, extracted invoice information,
                    performed automated verification,
                    categorized the expense and routed the
                    document through the accounting workflow.

                    <br><br>

                    The Manager Agent analyzed the outputs
                    from the specialized accounting agents
                    using local GenAI.

                    <br><br>

                    The final accounting action remains
                    under human control.

                </p>

            </div>


            <!-- GENAI REASONING -->

            <div class="card">

                <div class="ai-box">

                    <div class="ai-title">
                        🧠 GenAI Manager Reasoning
                    </div>

                    <div class="ai-subtitle">

                        Llama 3.2 analyzed the document,
                        verification result, expense category
                        and workflow context.

                    </div>

                    <div class="ai-reasoning">

                        ${escapeHtml(
                            aiReasoning
                        )}

                    </div>

                </div>

            </div>


            <!-- WORKFLOW -->

            <div class="card">

                <h2>
                    🔄 Workflow Status
                </h2>


                <div class="decision-box">

                    <strong>
                        Current Workflow:
                    </strong>

                    ${escapeHtml(
                        doc.workflow_status ||
                        "Pending"
                    )}

                    <br><br>


                    <strong>
                        Human Decision:
                    </strong>

                    ${humanDecision}

                </div>

            </div>


            <!-- PIPELINE -->

            <div class="card">

                <h2>
                    🧠 FinFlow AI Pipeline
                </h2>


                <div class="log">


                    <div class="log-item">

                        ✓ 1. Document Agent —
                        Document received

                    </div>


                    <div class="log-item">

                        ✓ 2. Extraction —
                        Invoice information extracted

                    </div>


                    <div class="log-item">

                        ✓ 3. Verification Agent —
                        Invoice checked

                    </div>


                    <div class="log-item">

                        ✓ 4. Categorization Agent —
                        Expense categorized

                    </div>


                    <div class="log-item">

                        ✓ 5. Workflow Agent —
                        Next action determined

                    </div>


                    <div class="log-item">

                        ✓ 6. Manager Agent —
                        Workflow context analyzed

                    </div>


                    <div class="log-item">

                        ✓ 7. GenAI —
                        Manager reasoning generated

                    </div>


                    <div class="log-item">

                        ✓ 8. Human Review —
                        Final decision controlled by human

                    </div>


                </div>

            </div>


        `;

    }


    catch (error) {

        console.error(error);


        area.innerHTML = `

            <div class="card">

                <div class="error">

                    ❌ Unable to load report.

                    <br><br>

                    Make sure FastAPI backend is running.

                </div>

            </div>

        `;

    }

}


/* ==========================================
   START
========================================== */

loadReport();


</script>

</body>

</html>
