<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>FinFlow AI - Upload Document</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fb;
    color: #1f2937;
    min-height: 100vh;
}

.layout {
    display: flex;
    min-height: 100vh;
}


/* SIDEBAR */

.sidebar {
    width: 240px;
    background: #111827;
    color: white;
    padding: 25px 18px;
    flex-shrink: 0;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 40px;
    padding-left: 12px;
}

.logo span {
    color: #60a5fa;
}

.nav a {
    display: block;
    text-decoration: none;
    color: #cbd5e1;
    padding: 13px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
}

.nav a:hover,
.nav a.active {
    background: #1f2937;
    color: white;
}


/* MAIN */

.main {
    flex: 1;
    padding: 30px 45px;
}


/* TOPBAR */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.topbar h1 {
    font-size: 28px;
}


/* USER */

.user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    background: white;
    padding: 7px 12px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #526ff1;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.user-info {
    display: flex;
    flex-direction: column;
}

.user-name {
    font-size: 14px;
    font-weight: bold;
}

.user-email {
    font-size: 11px;
    color: #64748b;
    margin-top: 3px;
}


/* UPLOAD BOX */

.upload-container {
    max-width: 850px;
    margin: 50px auto;
    background: white;
    padding: 45px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    text-align: center;
}

.upload-icon {
    font-size: 50px;
    margin-bottom: 20px;
}

.upload-container h2 {
    font-size: 26px;
    margin-bottom: 10px;
}

.subtitle {
    color: #64748b;
    margin-bottom: 30px;
}


/* DROP AREA */

.drop-area {
    border: 2px dashed #cbd5e1;
    border-radius: 14px;
    padding: 45px 25px;
    cursor: pointer;
    transition: 0.2s;
}

.drop-area:hover,
.drop-area.dragover {
    border-color: #2563eb;
    background: #eff6ff;
}

.drop-area p {
    color: #64748b;
    margin-top: 10px;
}

#fileInput {
    display: none;
}


/* FILE */

.file-name {
    margin-top: 20px;
    padding: 12px;
    background: #f1f5f9;
    border-radius: 8px;
    display: none;
    font-weight: 600;
}


/* BUTTON */

.upload-btn {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #315be8, #6847e8);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.upload-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}


/* MESSAGE */

.message {
    margin-top: 20px;
    padding: 13px;
    border-radius: 8px;
    display: none;
    text-align: left;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #b91c1c;
}


/* MOBILE */

@media (max-width: 800px) {

    .sidebar {
        display: none;
    }

    .main {
        padding: 20px;
    }

    .upload-container {
        padding: 30px 20px;
    }

    .topbar {
        align-items: flex-start;
        gap: 15px;
    }

}

</style>

</head>


<body>

<div class="layout">


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        FinFlow <span>AI</span>
    </div>

    <nav class="nav">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="upload.html" class="active">
            Upload
        </a>

        <a href="processing.html">
            AI Processing
        </a>

        <a href="document.html">
            Documents
        </a>

        <a href="review.html">
            Review
        </a>

        <a href="customers.html">
            Customers
        </a>

        <a href="reports.html">
            Reports
        </a>

        <a href="settings.html">
            Settings
        </a>

    </nav>

</aside>


<!-- MAIN -->

<main class="main">


<!-- TOPBAR -->

<div class="topbar">

    <h1>
        Upload Document
    </h1>

    <div class="user-profile">

        <div
            class="avatar"
            id="avatar">
            U
        </div>

        <div class="user-info">

            <div
                class="user-name"
                id="userName">
                User
            </div>

            <div
                class="user-email"
                id="userEmail">
                -
            </div>

        </div>

    </div>

</div>


<!-- UPLOAD -->

<section class="upload-container">

    <div class="upload-icon">
        📄
    </div>

    <h2>
        Upload Financial Document
    </h2>

    <p class="subtitle">
        Upload an invoice, receipt or accounting document for AI analysis.
    </p>


    <div
        class="drop-area"
        id="dropArea"
    >

        <div style="font-size:40px;">
            ⬆️
        </div>

        <strong>
            Click to select a file
        </strong>

        <p>
            or drag and drop your document here
        </p>

        <p>
            PDF, PNG, JPG, JPEG
        </p>

    </div>


    <input
        type="file"
        id="fileInput"
        accept=".pdf,.png,.jpg,.jpeg"
    >


    <div
        class="file-name"
        id="fileName">
    </div>


    <button
        class="upload-btn"
        id="uploadBtn"
        disabled
    >
        Upload & Analyze
    </button>


    <div
        class="message success"
        id="successMessage">
    </div>


    <div
        class="message error"
        id="errorMessage">
    </div>

</section>

</main>

</div>


<script>

/* =========================================
   API
========================================= */

const API_URL =
    "https://chili-latch-cardinal.ngrok-free.dev";


/* =========================================
   LOGIN
========================================= */

const loggedIn =
    localStorage.getItem("loggedIn");

const userEmail =
    localStorage.getItem("userEmail") || "";

const userName =
    localStorage.getItem("userName") || "User";


if (
    loggedIn !== "true" ||
    !userEmail
) {

    window.location.href =
        "index.html";

}


/* =========================================
   USER
========================================= */

document.getElementById(
    "userName"
).textContent =
    userName;

document.getElementById(
    "userEmail"
).textContent =
    userEmail;

document.getElementById(
    "avatar"
).textContent =
    userName
        .charAt(0)
        .toUpperCase();


/* =========================================
   ELEMENTS
========================================= */

const dropArea =
    document.getElementById(
        "dropArea"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const fileName =
    document.getElementById(
        "fileName"
    );

const uploadBtn =
    document.getElementById(
        "uploadBtn"
    );

const successMessage =
    document.getElementById(
        "successMessage"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


let selectedFile = null;


/* =========================================
   CLEAR OLD RESULT
========================================= */

function clearOldProcessingData() {

    const keys = [

        "uploadedFile",

        "invoiceData",

        "verification",

        "category",

        "workflow",

        "documentResult",

        "managerAgent",

        "databaseResult",

        "customer",

        "customerHistory",

        "backendResponse",

        "documentId",

        "newUploadReady"

    ];


    keys.forEach(
        function(key) {

            localStorage.removeItem(
                key
            );

        }
    );

}


/* =========================================
   FILE SELECT
========================================= */

dropArea.addEventListener(
    "click",
    function() {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    function() {

        if (
            fileInput.files.length > 0
        ) {

            selectFile(
                fileInput.files[0]
            );

        }

    }
);


/* =========================================
   SELECT FILE
========================================= */

function selectFile(file) {

    selectedFile = file;

    clearOldProcessingData();


    fileName.textContent =
        "Selected: " + file.name;

    fileName.style.display =
        "block";


    uploadBtn.disabled =
        false;


    successMessage.style.display =
        "none";

    errorMessage.style.display =
        "none";

}


/* =========================================
   DRAG DROP
========================================= */

dropArea.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

        dropArea.classList.add(
            "dragover"
        );

    }
);


dropArea.addEventListener(
    "dragleave",
    function() {

        dropArea.classList.remove(
            "dragover"
        );

    }
);


dropArea.addEventListener(
    "drop",
    function(event) {

        event.preventDefault();

        dropArea.classList.remove(
            "dragover"
        );


        if (
            event.dataTransfer.files.length > 0
        ) {

            selectFile(
                event.dataTransfer.files[0]
            );

        }

    }
);


/* =========================================
   UPLOAD
========================================= */

uploadBtn.addEventListener(
    "click",
    async function() {

        if (!selectedFile) {

            return;

        }


        uploadBtn.disabled =
            true;

        uploadBtn.textContent =
            "Uploading & Analyzing...";


        successMessage.style.display =
            "none";

        errorMessage.style.display =
            "none";


        /*
           IMPORTANT:
           Remove old result before
           sending new document.
        */

        clearOldProcessingData();


        const formData =
            new FormData();


        formData.append(
            "file",
            selectedFile
        );


        try {

            const response =
                await fetch(
                    API_URL +
                    "/documents/upload",
                    {
                        method: "POST",

                        headers: {
                            "ngrok-skip-browser-warning":
                                "true"
                        },

                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Document upload failed."
                );

            }


            console.log(
                "Backend response:",
                data
            );


            /* =================================
               SAVE ONLY NEW RESULT
            ================================= */

            localStorage.setItem(
                "uploadedFile",
                selectedFile.name
            );


            localStorage.setItem(
                "invoiceData",
                JSON.stringify(
                    data.invoice_data || {}
                )
            );


            localStorage.setItem(
                "verification",
                JSON.stringify(
                    data.verification || {}
                )
            );


            localStorage.setItem(
                "category",
                JSON.stringify(
                    data.category || {}
                )
            );


            localStorage.setItem(
                "workflow",
                JSON.stringify(
                    data.workflow || {}
                )
            );


            localStorage.setItem(
                "documentResult",
                JSON.stringify(
                    data.document || {}
                )
            );


            localStorage.setItem(
                "managerAgent",
                JSON.stringify(
                    data.manager_agent || {}
                )
            );


            localStorage.setItem(
                "databaseResult",
                JSON.stringify(
                    data.database || {}
                )
            );


            localStorage.setItem(
                "customer",
                JSON.stringify(
                    data.customer || {}
                )
            );


            localStorage.setItem(
                "customerHistory",
                JSON.stringify(
                    data.customer_history || {}
                )
            );


            localStorage.setItem(
                "backendResponse",
                JSON.stringify(
                    data
                )
            );


            /* =================================
               DOCUMENT ID
            ================================= */

            const documentId =
                data.database &&
                data.database.id
                    ? data.database.id
                    : "";


            localStorage.setItem(
                "documentId",
                String(documentId)
            );


            /*
               THIS IS THE IMPORTANT FLAG
            */

            localStorage.setItem(
                "newUploadReady",
                "true"
            );


            successMessage.textContent =
                "Document uploaded and processed successfully!";

            successMessage.style.display =
                "block";


            /*
               Go directly to processing page
            */

            setTimeout(
                function() {

                    window.location.href =
                        "processing.html";

                },
                500
            );

        }

        catch (error) {

            console.error(
                "Upload error:",
                error
            );


            errorMessage.textContent =
                error.message ||
                "Unable to connect to FinFlow AI backend.";

            errorMessage.style.display =
                "block";


            uploadBtn.disabled =
                false;

            uploadBtn.textContent =
                "Upload & Analyze";

        }

    }
);

</script>

</body>

</html>
